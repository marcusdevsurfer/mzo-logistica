<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#15803d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clipboard body -->
  <rect x="40" y="25" width="120" height="150" rx="8" fill="none"/>
  
  <!-- Clip at top -->
  <rect x="90" y="18" width="20" height="15" rx="3" fill="none"/>
  
  <!-- Header line -->
  <line x1="40" y1="55" x2="160" y2="55" stroke="#15803d" stroke-width="4.5"/>
  
  <!-- Text lines -->
  <line x1="55" y1="75" x2="145" y2="75" stroke="#15803d" stroke-width="4"/>
  <line x1="55" y1="95" x2="145" y2="95" stroke="#15803d" stroke-width="4"/>
  <line x1="55" y1="115" x2="125" y2="115" stroke="#15803d" stroke-width="4"/>
  <line x1="55" y1="135" x2="125" y2="135" stroke="#15803d" stroke-width="4"/>
  
  <!-- Checkmark stamp circle -->
  <circle cx="130" cy="95" r="20" fill="none" stroke="#15803d" stroke-width="4"/>
  
  <!-- Checkmark inside -->
  <path d="M 120 95 L 128 103 L 145 85" fill="none" stroke="#15803d" stroke-width="4.5"/>
</svg>
