<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#15803d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Warehouse building -->
  <polygon points="100,25 170,70 170,165 30,165 30,70" fill="none"/>
  
  <!-- Roof line -->
  <line x1="30" y1="70" x2="100" y2="25" stroke="#15803d" stroke-width="4.5"/>
  <line x1="100" y1="25" x2="170" y2="70" stroke="#15803d" stroke-width="4.5"/>
  
  <!-- Door -->
  <rect x="80" y="115" width="40" height="50" fill="none"/>
  <circle cx="115" cy="145" r="3" fill="#15803d"/>
  
  <!-- Window 1 -->
  <rect x="45" y="80" width="18" height="18" fill="none"/>
  <line x1="45" y1="89" x2="63" y2="89" stroke="#15803d" stroke-width="4.5"/>
  <line x1="54" y1="80" x2="54" y2="98" stroke="#15803d" stroke-width="4.5"/>
  
  <!-- Window 2 -->
  <rect x="137" y="80" width="18" height="18" fill="none"/>
  <line x1="137" y1="89" x2="155" y2="89" stroke="#15803d" stroke-width="4.5"/>
  <line x1="146" y1="80" x2="146" y2="98" stroke="#15803d" stroke-width="4.5"/>
  
  <!-- Base line -->
  <line x1="30" y1="165" x2="170" y2="165" stroke="#15803d" stroke-width="4.5"/>
</svg>
