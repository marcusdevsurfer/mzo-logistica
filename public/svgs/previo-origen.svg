<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#15803d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Magnifying glass handle -->
  <line x1="145" y1="145" x2="175" y2="175" stroke="#15803d" stroke-width="4.5"/>
  
  <!-- Magnifying glass lens -->
  <circle cx="105" cy="105" r="45" fill="none"/>
  
  <!-- Document inside lens -->
  <rect x="75" y="80" width="40" height="50" rx="3" fill="none"/>
  
  <!-- Lines on document -->
  <line x1="82" y1="92" x2="108" y2="92" stroke="#15803d" stroke-width="3.5"/>
  <line x1="82" y1="104" x2="108" y2="104" stroke="#15803d" stroke-width="3.5"/>
  <line x1="82" y1="116" x2="100" y2="116" stroke="#15803d" stroke-width="3.5"/>
  
  <!-- Checkmark on document -->
  <path d="M 95 125 L 100 130 L 110 120" fill="none" stroke="#15803d" stroke-width="3.5"/>
</svg>
