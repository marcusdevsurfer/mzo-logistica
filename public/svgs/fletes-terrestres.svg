<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#15803d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Truck cargo area -->
  <rect x="20" y="80" width="110" height="55" rx="3" fill="none"/>
  
  <!-- Truck cabin -->
  <rect x="130" y="80" width="40" height="45" rx="3" fill="none"/>
  
  <!-- Windshield -->
  <polygon points="138,85 165,85 160,110 143,110" fill="none"/>
  
  <!-- Window division -->
  <line x1="150" y1="85" x2="150" y2="110" stroke="#15803d" stroke-width="4.5"/>
  
  <!-- Wheels (rear axle) -->
  <circle cx="45" cy="140" r="16" fill="none"/>
  <circle cx="95" cy="140" r="16" fill="none"/>
  
  <!-- Wheels (front axle) -->
  <circle cx="155" cy="140" r="16" fill="none"/>
  
  <!-- Wheel hubs -->
  <circle cx="45" cy="140" r="6" fill="#15803d"/>
  <circle cx="95" cy="140" r="6" fill="#15803d"/>
  <circle cx="155" cy="140" r="6" fill="#15803d"/>
  
  <!-- Road -->
  <line x1="10" y1="158" x2="190" y2="158" stroke="#15803d" stroke-width="4.5"/>
</svg>
