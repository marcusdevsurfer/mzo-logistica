<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Truck body -->
  <rect x="30" y="80" width="100" height="50" rx="3"/>
  
  <!-- Cabin -->
  <rect x="130" y="80" width="35" height="35" rx="2"/>
  
  <!-- Windshield -->
  <polygon points="135,85 160,85 155,105 140,105" fill="none"/>
  
  <!-- Wheels -->
  <circle cx="55" cy="140" r="15" fill="none"/>
  <circle cx="105" cy="140" r="15" fill="none"/>
  <circle cx="150" cy="140" r="15" fill="none"/>
  
  <!-- Wheel details -->
  <circle cx="55" cy="140" r="6" fill="#15803d"/>
  <circle cx="105" cy="140" r="6" fill="#15803d"/>
  <circle cx="150" cy="140" r="6" fill="#15803d"/>
  
  <!-- Road line -->
  <line x1="10" y1="160" x2="190" y2="160" stroke="#15803d" stroke-width="1.5"/>
  <line x1="20" y1="165" x2="180" y2="165" stroke="#15803d" stroke-width="1" stroke-dasharray="5,5"/>
</svg>
